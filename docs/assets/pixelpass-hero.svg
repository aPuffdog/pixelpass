<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">PixelPass overview</title>
  <desc id="desc">Without PixelPass, repeated Base64 history creates 413 responses. PixelPass caches images as DeepSeek file IDs, reducing the latest sample request from 256 MiB to 2.1 MiB.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071411"/>
      <stop offset=".52" stop-color="#0b1517"/>
      <stop offset="1" stop-color="#10120d"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9cf9c8"/>
      <stop offset="1" stop-color="#48d6b3"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#40e0b0" stop-opacity=".30"/>
      <stop offset="1" stop-color="#40e0b0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffad5b" stop-opacity=".23"/>
      <stop offset="1" stop-color="#ffad5b" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000" flood-opacity=".34"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
  </defs>

  <rect width="1600" height="820" rx="36" fill="url(#bg)"/>
  <rect width="1600" height="820" rx="36" fill="url(#grid)"/>
  <circle cx="1330" cy="90" r="330" fill="url(#glowB)"/>
  <circle cx="260" cy="610" r="360" fill="url(#glowA)"/>

  <g transform="translate(80 62)">
    <circle cx="28" cy="28" r="28" fill="#0f2a24" stroke="#79e8bd" stroke-width="2"/>
    <path d="M17 18h22v22H17z" fill="none" stroke="#9cf9c8" stroke-width="2.5"/>
    <path d="M23 12h22v22M29 6h22v22" fill="none" stroke="#9cf9c8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="28" cy="28" r="3.5" fill="#ffcf72"/>
    <text x="75" y="38" fill="#f5fff9" font-family="Inter, PingFang SC, sans-serif" font-size="35" font-weight="750" letter-spacing="-.6">PixelPass</text>
    <rect x="266" y="9" width="103" height="34" rx="17" fill="#14231f" stroke="#315247"/>
    <text x="317" y="32" text-anchor="middle" fill="#9de9c8" font-family="Inter, PingFang SC, sans-serif" font-size="15" font-weight="650">LOCAL RELAY</text>
  </g>

  <text x="80" y="160" fill="#f7fff9" font-family="Inter, PingFang SC, sans-serif" font-size="58" font-weight="760" letter-spacing="-1.8">让图片只上传一次，</text>
  <text x="80" y="220" fill="url(#mint)" font-family="Inter, PingFang SC, sans-serif" font-size="58" font-weight="760" letter-spacing="-1.8">让长对话继续前行。</text>
  <text x="82" y="258" fill="#9cafaa" font-family="Inter, PingFang SC, sans-serif" font-size="20">Codex 图片历史反复塞进请求？本地缓存 + DeepSeek file_id，直接绕开 Payload Too Large。</text>

  <g filter="url(#shadow)">
    <rect x="80" y="312" width="430" height="300" rx="24" fill="#121717" stroke="#3d3530"/>
    <rect x="558" y="312" width="484" height="300" rx="24" fill="#101d19" stroke="#315a4a"/>
    <rect x="1090" y="312" width="430" height="300" rx="24" fill="#121a16" stroke="#3a6652"/>
  </g>

  <text x="112" y="354" fill="#84918d" font-family="Inter, PingFang SC, sans-serif" font-size="14" font-weight="700" letter-spacing="1.8">WITHOUT PIXELPASS</text>
  <g transform="translate(112 376)">
    <rect width="184" height="30" rx="15" fill="#2b1917"/>
    <text x="15" y="20" fill="#ff9c87" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13">history × 183 images</text>
    <rect y="42" width="244" height="84" rx="14" fill="#1b1e1e" stroke="#343b39"/>
    <rect x="16" y="58" width="30" height="42" rx="5" fill="#5a3d49"/>
    <rect x="55" y="58" width="30" height="42" rx="5" fill="#395057"/>
    <rect x="94" y="58" width="30" height="42" rx="5" fill="#58523b"/>
    <text x="140" y="83" fill="#d8e1de" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13">base64</text>
    <text x="16" y="150" fill="#7f8e89" font-family="Inter, PingFang SC, sans-serif" font-size="14">每次请求都重新携带</text>
    <text x="16" y="181" fill="#ffb39f" font-family="ui-monospace, SFMono-Regular, monospace" font-size="17" font-weight="700">256 MiB ↗ 413</text>
  </g>

  <g transform="translate(523 449)">
    <rect x="-14" y="-5" width="50" height="34" rx="17" fill="#13221c"/>
    <path d="M5 14h22m0 0-7-7m7 7-7 7" fill="none" stroke="#79e8bd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(594 380)">
    <circle cx="30" cy="30" r="30" fill="#17382d" stroke="#79e8bd" stroke-width="2"/>
    <path d="M18 21h24v20H18zM24 15h24v20" fill="none" stroke="#b9ffdc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="76" y="26" fill="#e9fff4" font-family="Inter, PingFang SC, sans-serif" font-size="18" font-weight="700">拦截本机请求</text>
    <text x="76" y="50" fill="#809f94" font-family="Inter, PingFang SC, sans-serif" font-size="14">不改变 Codex 会话文件</text>

    <path d="M31 82v34" stroke="#4c7565" stroke-width="2"/>
    <circle cx="30" cy="134" r="19" fill="#17382d"/>
    <text x="30" y="140" text-anchor="middle" fill="#a9fbd5" font-family="Inter, sans-serif" font-size="17">01</text>
    <text x="63" y="132" fill="#e9fff4" font-family="Inter, PingFang SC, sans-serif" font-size="17" font-weight="650">按图片内容 SHA-256 去重</text>
    <text x="63" y="156" fill="#809f94" font-family="Inter, PingFang SC, sans-serif" font-size="14">相同图片只上传一次</text>

    <path d="M31 174v30" stroke="#4c7565" stroke-width="2"/>
    <circle cx="30" cy="220" r="19" fill="#17382d"/>
    <text x="30" y="226" text-anchor="middle" fill="#a9fbd5" font-family="Inter, sans-serif" font-size="17">02</text>
    <text x="63" y="219" fill="#e9fff4" font-family="Inter, PingFang SC, sans-serif" font-size="17" font-weight="650">上传 Files API，替换为 file_id</text>
    <text x="63" y="237" fill="#809f94" font-family="Inter, PingFang SC, sans-serif" font-size="14">后续请求直接命中本地缓存</text>

    <rect x="209" y="22" width="209" height="31" rx="15.5" fill="#1b322b"/>
    <text x="313" y="43" text-anchor="middle" fill="#88eabb" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13">127.0.0.1:17892</text>
  </g>

  <g transform="translate(1022 449)">
    <rect x="-14" y="-5" width="50" height="34" rx="17" fill="#13221c"/>
    <path d="M5 14h22m0 0-7-7m7 7-7 7" fill="none" stroke="#79e8bd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="1122" y="354" fill="#84918d" font-family="Inter, PingFang SC, sans-serif" font-size="14" font-weight="700" letter-spacing="1.8">WITH PIXELPASS</text>
  <g transform="translate(1122 376)">
    <rect width="176" height="30" rx="15" fill="#173326"/>
    <text x="15" y="20" fill="#9df5c7" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13">183 images → refs</text>
    <rect y="42" width="326" height="84" rx="14" fill="#14211c" stroke="#315a49"/>
    <rect x="16" y="58" width="30" height="42" rx="5" fill="#315a49"/>
    <rect x="55" y="58" width="30" height="42" rx="5" fill="#315a49"/>
    <rect x="94" y="58" width="30" height="42" rx="5" fill="#315a49"/>
    <text x="140" y="74" fill="#e2f9ee" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13">file_id</text>
    <text x="140" y="94" fill="#87ac9b" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">cached • reusable</text>
    <text x="16" y="150" fill="#7f9e92" font-family="Inter, PingFang SC, sans-serif" font-size="14">DeepSeek 只收到轻量引用</text>
    <text x="16" y="181" fill="#9df5c7" font-family="ui-monospace, SFMono-Regular, monospace" font-size="17" font-weight="700">2.1 MiB ✓</text>
  </g>

  <g transform="translate(80 646)">
    <rect width="452" height="108" rx="20" fill="#0f1c18" stroke="#29483c"/>
    <text x="24" y="35" fill="#80968d" font-family="Inter, PingFang SC, sans-serif" font-size="14">最近一次图片请求</text>
    <text x="24" y="75" fill="#f5fff9" font-family="Inter, PingFang SC, sans-serif" font-size="29" font-weight="750">256 MiB <tspan fill="#64d8ad">→</tspan> 2.1 MiB</text>
    <text x="405" y="75" text-anchor="end" fill="#8ce6bd" font-family="Inter, sans-serif" font-size="16" font-weight="700">-99.2%</text>
  </g>
  <g transform="translate(574 646)">
    <rect width="452" height="108" rx="20" fill="#0f1c18" stroke="#29483c"/>
    <text x="24" y="35" fill="#80968d" font-family="Inter, PingFang SC, sans-serif" font-size="14">长期会话缓存复用</text>
    <text x="24" y="77" fill="#f5fff9" font-family="Inter, PingFang SC, sans-serif" font-size="34" font-weight="750">52,382 <tspan fill="#88a89b" font-size="18">次</tspan></text>
    <text x="405" y="75" text-anchor="end" fill="#ffcf72" font-family="Inter, PingFang SC, sans-serif" font-size="14">已避免重复上传</text>
  </g>
  <g transform="translate(1068 646)">
    <rect width="452" height="108" rx="20" fill="#0f1c18" stroke="#29483c"/>
    <text x="24" y="35" fill="#80968d" font-family="Inter, PingFang SC, sans-serif" font-size="14">默认安全策略</text>
    <text x="24" y="77" fill="#f5fff9" font-family="Inter, PingFang SC, sans-serif" font-size="34" font-weight="750">LOCAL <tspan fill="#64d8ad">ONLY</tspan></text>
    <text x="405" y="75" text-anchor="end" fill="#88a89b" font-family="Inter, PingFang SC, sans-serif" font-size="14">不记录图片或凭证</text>
  </g>

  <text x="80" y="795" fill="#63736e" font-family="Inter, PingFang SC, sans-serif" font-size="13">示例数据来自一个长期图片会话，实际结果取决于请求历史、图片和缓存命中情况。</text>
</svg>
