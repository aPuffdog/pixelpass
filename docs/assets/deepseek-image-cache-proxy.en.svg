<svg viewBox="0 0 1600 930" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek Image Cache Proxy architecture sheet</title>
  <desc id="desc">A monochrome dimensional drawing showing Codex inline images entering a local cache proxy, becoming DeepSeek file IDs, and reducing a 256 MiB request to 2.1 MiB.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 Z" fill="#111"/></marker>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V7" stroke="#888" stroke-width="1"/></pattern>
    <style>
      .border{fill:none;stroke:#111;stroke-width:1.2}.obj{fill:#fff;stroke:#111;stroke-width:1.6}.well{fill:#f2f2f2;stroke:#111;stroke-width:1}.slot{fill:none;stroke:#4b4b4b;stroke-width:.9;stroke-dasharray:5 4}.soft{fill:#e4e4e4;stroke:#111;stroke-width:1}.thin{fill:none;stroke:#111;stroke-width:.8}.dash{fill:none;stroke:#777;stroke-width:.8;stroke-dasharray:12 4 2 4}.dim{fill:none;stroke:#111;stroke-width:.7;marker-start:url(#arrow);marker-end:url(#arrow)}.ext{fill:none;stroke:#111;stroke-width:.55}.lead{fill:none;stroke:#111;stroke-width:.7}.txt{font:400 13px Arial,"PingFang SC",sans-serif;fill:#111}.small{font:400 10px Arial,"PingFang SC",sans-serif;fill:#4b4b4b;letter-spacing:.08em}.caps{font:400 12px Arial,"PingFang SC",sans-serif;fill:#111;letter-spacing:.09em}.big{font:400 23px Arial,"PingFang SC",sans-serif;fill:#111;letter-spacing:.04em}.metric{font:400 30px Arial,"PingFang SC",sans-serif;fill:#111;letter-spacing:.02em}.note{fill:#fff;stroke:#111;stroke-width:.9}.table-head{font:700 10px Arial,"PingFang SC",sans-serif;fill:#111;letter-spacing:.08em}.table-cell{font:400 11px Arial,"PingFang SC",sans-serif;fill:#111}
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="930" fill="#fff"/>
  <rect x="30" y="24" width="1540" height="882" rx="14" class="border"/>
  <text x="60" y="62" class="caps">NOTES: [1] BASE64 HISTORY IS REPEATED IN LONG CODEX SESSIONS. [2] ONLY THE REQUEST REPRESENTATION CHANGES. [3] FILE_ID REFERENCES ARE REUSED.</text>
  <text x="60" y="82" class="caps">[4] LOCAL LISTENER: 127.0.0.1:17892. [5] DEFAULT MANAGED REQUEST ENVELOPE: 1 GIB. [6] SHADOW / CONTENT VALUES ARE SCHEMATIC.</text>

  <rect x="60" y="118" width="1480" height="2" fill="#111"/>
  <text x="80" y="160" class="small">PLAN VIEW · REQUEST TRANSFORMATION · SCALE 0.9:1</text>
  <text x="1504" y="160" text-anchor="end" class="small">SEE VARIABLE TABLES BELOW</text>

  <!-- left: source request -->
  <rect x="110" y="215" width="350" height="300" rx="12" class="obj"/>
  <text x="135" y="250" class="big">CODEX REQUEST</text>
  <text x="135" y="275" class="small">INLINE IMAGE HISTORY · INPUT_IMAGE</text>
  <rect x="135" y="308" width="300" height="105" rx="8" class="well"/>
  <rect x="155" y="328" width="48" height="64" rx="4" fill="url(#hatch)" stroke="#111"/>
  <rect x="217" y="328" width="48" height="64" rx="4" fill="url(#hatch)" stroke="#111"/>
  <rect x="279" y="328" width="48" height="64" rx="4" fill="url(#hatch)" stroke="#111"/>
  <rect x="341" y="328" width="48" height="64" rx="4" fill="url(#hatch)" stroke="#111"/>
  <text x="155" y="432" class="caps">BASE64 × 183 IMAGES</text>
  <text x="135" y="474" class="txt">History grows before the model context does.</text>
  <rect x="135" y="548" width="300" height="64" rx="8" class="soft"/>
  <text x="155" y="575" class="small">UPSTREAM FAILURE</text>
  <text x="155" y="600" class="metric">256 MiB  /  413</text>
  <rect x="72" y="202" width="18" height="18" class="note"/><text x="81" y="216" text-anchor="middle" class="table-cell">1</text>

  <!-- center: proxy -->
  <rect x="625" y="190" width="350" height="370" rx="12" class="obj"/>
  <text x="650" y="228" class="big">LOCAL CACHE</text>
  <text x="650" y="253" class="small">127.0.0.1:17892 · REQUEST REWRITE</text>
  <rect x="650" y="285" width="300" height="58" rx="8" class="slot"/>
  <text x="800" y="320" text-anchor="middle" class="caps">SHA-256 DEDUPE · CACHE LOOKUP</text>
  <line x1="800" y1="343" x2="800" y2="370" class="lead" marker-end="url(#arrow)"/>
  <rect x="650" y="385" width="300" height="70" rx="8" class="well"/>
  <text x="670" y="414" class="small">FIRST SEEN IMAGE</text>
  <text x="670" y="441" class="txt">DeepSeek Files API  ->  file_id</text>
  <line x1="800" y1="455" x2="800" y2="482" class="lead" marker-end="url(#arrow)"/>
  <rect x="650" y="497" width="300" height="40" rx="8" class="soft"/>
  <text x="800" y="523" text-anchor="middle" class="caps">REPLACE INLINE DATA WITH REFERENCE</text>
  <rect x="587" y="177" width="18" height="18" class="note"/><text x="596" y="191" text-anchor="middle" class="table-cell">2</text>

  <!-- right: upstream -->
  <rect x="1140" y="215" width="350" height="300" rx="12" class="obj"/>
  <text x="1165" y="250" class="big">DEEPSEEK</text>
  <text x="1165" y="275" class="small">RESPONSES API · SMALL REQUEST</text>
  <rect x="1165" y="308" width="300" height="105" rx="8" class="well"/>
  <rect x="1190" y="333" width="72" height="54" rx="5" class="soft"/>
  <text x="1226" y="366" text-anchor="middle" class="small">FILE_ID</text>
  <line x1="1285" y1="360" x2="1315" y2="360" class="lead" marker-end="url(#arrow)"/>
  <text x="1338" y="354" class="caps">REFS ONLY</text>
  <text x="1338" y="378" class="small">NO REPEATED IMAGE BYTES</text>
  <text x="1165" y="450" class="txt">Same visual input, smaller HTTP body.</text>
  <rect x="1165" y="548" width="300" height="64" rx="8" class="soft"/>
  <text x="1185" y="575" class="small">OBSERVED REQUEST</text>
  <text x="1185" y="600" class="metric">2.1 MiB  /  OK</text>
  <rect x="1110" y="202" width="18" height="18" class="note"/><text x="1119" y="216" text-anchor="middle" class="table-cell">3</text>

  <!-- flow arrows -->
  <line x1="465" y1="365" x2="612" y2="365" class="dim"/>
  <text x="538" y="348" text-anchor="middle" class="small">POST /RESPONSES</text>
  <line x1="985" y1="365" x2="1127" y2="365" class="dim"/>
  <text x="1056" y="348" text-anchor="middle" class="small">FILE_ID REQUEST</text>

  <!-- dimensions -->
  <line x1="110" y1="650" x2="460" y2="650" class="dim"/><line x1="110" y1="616" x2="110" y2="662" class="ext"/><line x1="460" y1="616" x2="460" y2="662" class="ext"/><text x="285" y="642" text-anchor="middle" class="small">W1 · SOURCE SLOT</text>
  <line x1="625" y1="650" x2="975" y2="650" class="dim"/><line x1="625" y1="560" x2="625" y2="662" class="ext"/><line x1="975" y1="560" x2="975" y2="662" class="ext"/><text x="800" y="642" text-anchor="middle" class="small">W2 · CACHE SLOT</text>
  <line x1="1140" y1="650" x2="1490" y2="650" class="dim"/><line x1="1140" y1="616" x2="1140" y2="662" class="ext"/><line x1="1490" y1="616" x2="1490" y2="662" class="ext"/><text x="1315" y="642" text-anchor="middle" class="small">W3 · UPSTREAM SLOT</text>

  <!-- measured results -->
  <text x="80" y="708" class="small">OBSERVED RESULTS · ONE LONG IMAGE-HEAVY CODEX SESSION</text>
  <rect x="80" y="728" width="420" height="110" rx="8" class="obj"/>
  <text x="105" y="760" class="small">LATEST REQUEST · 183 IMAGES</text>
  <text x="105" y="803" class="metric">256 MiB  ->  2.1 MiB</text>
  <text x="475" y="803" text-anchor="end" class="small">-99.2%</text>
  <rect x="530" y="728" width="420" height="110" rx="8" class="obj"/>
  <text x="555" y="760" class="small">CUMULATIVE · 455 REQUESTS</text>
  <text x="555" y="803" class="metric">73.6 GiB  ->  632.8 MiB</text>
  <rect x="980" y="728" width="560" height="110" rx="8" class="obj"/>
  <text x="1005" y="760" class="small">CACHE REUSE · SAME ACCOUNT</text>
  <text x="1005" y="803" class="metric">52,382 IMAGE REFERENCES</text>

  <!-- variable table -->
  <text x="80" y="874" class="small">KEY VARIABLES</text>
  <text x="80" y="896" class="table-cell">W1 / W2 / W3  architecture slots  ·  S1  SHA-256 key  ·  H1  file_id substitution  ·  L1  1 GiB managed local request envelope</text>
  <text x="1520" y="896" text-anchor="end" class="small">DATE 2026-10-27  |  SHEET 1 OF 1</text>
</svg>
