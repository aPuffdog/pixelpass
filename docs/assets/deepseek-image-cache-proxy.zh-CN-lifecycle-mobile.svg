<svg xmlns="http://www.w3.org/2000/svg" width="720" height="2200" viewBox="0 0 720 2200" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">一张图片从出现到过期的完整路径</title><desc id="desc">生命周期示意。A、B 表示图片字节，file_A、file_B 仅为 DeepSeek 返回 ID 的示例，并非图片哈希。</desc>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto" markerUnits="strokeWidth"><path d="M1 1L11 6 1 11Z" fill="#363636"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif}svg{color-scheme:light}</style>
<rect width="720" height="2200" fill="#fff"/><text x="48" y="48" font-size="20" font-weight="650" text-anchor="start" fill="#626262">DEEPSEEK IMAGE CACHE PROXY</text><text x="48" y="112" font-size="35" font-weight="650" text-anchor="start" fill="#171717" data-max-width="624">从首次上传，到历史图片复用</text><text x="48" y="154" font-size="23" font-weight="400" text-anchor="start" fill="#626262" data-max-width="624">用同一张 A 和新图 B，跟随两次请求。ID 为示例。</text><rect x="48" y="200" width="624" height="230" rx="16" fill="#fff" stroke="#999" stroke-width="1.5"/><rect x="72" y="224" width="50" height="46" rx="9" fill="#f0f0f0" stroke="#cecece" stroke-width="1.5"/><text x="97" y="255" font-size="24" font-weight="650" text-anchor="middle" fill="#171717" data-max-width="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1</text><text x="142" y="256" font-size="27" font-weight="650" text-anchor="start" fill="#171717" data-max-width="506">首次请求：图片 A</text><g transform="translate(76 284) scale(0.88)"><rect x="0" y="0" width="100" height="100" rx="10" fill="#fff" stroke="#555" stroke-width="1.5"/><rect x="7" y="7" width="86" height="66" rx="5" fill="#eee" stroke="none" stroke-width="1.5"/><circle cx="72" cy="27" r="8" fill="#8b8b8b"/><path d="M8 68L34 32l20 24 13-17 25 29Z" fill="#737373"/><path d="M8 68L34 49 53 68Z" fill="#bcbcbc"/><text x="50" y="94" font-size="21" font-weight="650" text-anchor="middle" fill="#171717">A</text></g><text x="193" y="307" font-size="26" font-weight="400" text-anchor="start" fill="#171717" data-max-width="450" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Codex → localhost</text><text x="193" y="349" font-size="25" font-weight="400" text-anchor="start" fill="#171717" data-max-width="450">image_url 携带 Base64</text><text x="72" y="402" font-size="23" font-weight="400" text-anchor="start" fill="#171717" data-max-width="576">代理解码 → 算 hash(A) → 本地尚无映射</text><path d="M360 445L360 480" fill="none" stroke="#363636" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="500" width="624" height="230" rx="16" fill="#fff" stroke="#999" stroke-width="1.5"/><rect x="72" y="524" width="50" height="46" rx="9" fill="#f0f0f0" stroke="#cecece" stroke-width="1.5"/><text x="97" y="555" font-size="24" font-weight="650" text-anchor="middle" fill="#171717" data-max-width="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">2</text><text x="142" y="556" font-size="27" font-weight="650" text-anchor="start" fill="#171717" data-max-width="506">上传：由 DS 生成文件 ID</text><g transform="translate(76 591) scale(0.76)"><rect x="0" y="0" width="100" height="100" rx="10" fill="#fff" stroke="#555" stroke-width="1.5"/><rect x="7" y="7" width="86" height="66" rx="5" fill="#eee" stroke="none" stroke-width="1.5"/><circle cx="72" cy="27" r="8" fill="#8b8b8b"/><path d="M8 68L34 32l20 24 13-17 25 29Z" fill="#737373"/><path d="M8 68L34 49 53 68Z" fill="#bcbcbc"/><text x="50" y="94" font-size="21" font-weight="650" text-anchor="middle" fill="#171717">A</text></g><text x="180" y="609" font-size="25" font-weight="400" text-anchor="start" fill="#171717" data-max-width="456" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Proxy → POST /files → DS</text><path d="M180 637L623 637" fill="none" stroke="#363636" stroke-width="2" marker-end="url(#arrow)"/><text x="180" y="683" font-size="25" font-weight="400" text-anchor="start" fill="#171717" data-max-width="456" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">DS → { "id": "file_A" }</text><text x="72" y="708" font-size="22" font-weight="400" text-anchor="start" fill="#626262" data-max-width="576">原始图片保存在 DeepSeek 账户内</text><path d="M360 745L360 780" fill="none" stroke="#363636" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="800" width="624" height="230" rx="16" fill="#fff" stroke="#999" stroke-width="1.5"/><rect x="72" y="824" width="50" height="46" rx="9" fill="#f0f0f0" stroke="#cecece" stroke-width="1.5"/><text x="97" y="855" font-size="24" font-weight="650" text-anchor="middle" fill="#171717" data-max-width="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">3</text><text x="142" y="856" font-size="27" font-weight="650" text-anchor="start" fill="#171717" data-max-width="506">本机保存映射，并改写请求</text><rect x="72" y="883" width="576" height="46" rx="9" fill="#f0f0f0" stroke="#cecece" stroke-width="1.5"/><text x="360" y="914" font-size="25" font-weight="650" text-anchor="middle" fill="#171717" data-max-width="560" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">hash(A) → file_A + expiresAt</text><text x="72" y="972" font-size="23" font-weight="400" text-anchor="start" fill="#171717" data-max-width="576">缓存按认证指纹隔离；不保存图片本体</text><text x="72" y="1008" font-size="23" font-weight="400" text-anchor="start" fill="#626262" data-max-width="576">hash 负责查找；file_A 来自 DS 的上传响应</text><path d="M360 1045L360 1080" fill="none" stroke="#363636" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="1100" width="624" height="230" rx="16" fill="#fff" stroke="#999" stroke-width="1.5"/><rect x="72" y="1124" width="50" height="46" rx="9" fill="#f0f0f0" stroke="#cecece" stroke-width="1.5"/><text x="97" y="1155" font-size="24" font-weight="650" text-anchor="middle" fill="#171717" data-max-width="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">4</text><text x="142" y="1156" font-size="27" font-weight="650" text-anchor="start" fill="#171717" data-max-width="506">引用：DS 仍能看到图片 A</text><rect x="72" y="1180" width="576" height="46" rx="9" fill="#f0f0f0" stroke="#cecece" stroke-width="1.5"/><text x="360" y="1211" font-size="24" font-weight="650" text-anchor="middle" fill="#171717" data-max-width="560" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">POST /responses · file_id: file_A</text><text x="72" y="1265" font-size="24" font-weight="400" text-anchor="start" fill="#171717" data-max-width="576">DS 按 ID 读取账户内图片 → 模型理解</text><text x="72" y="1305" font-size="23" font-weight="400" text-anchor="start" fill="#626262" data-max-width="576">模型回复通过代理流式返回 Codex</text><path d="M360 1345L360 1380" fill="none" stroke="#363636" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="1400" width="624" height="340" rx="16" fill="#f5f5f5" stroke="#999" stroke-width="1.5"/><rect x="72" y="1424" width="50" height="46" rx="9" fill="#f0f0f0" stroke="#cecece" stroke-width="1.5"/><text x="97" y="1455" font-size="24" font-weight="650" text-anchor="middle" fill="#171717" data-max-width="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">5</text><text x="142" y="1457" font-size="27" font-weight="650" text-anchor="start" fill="#171717" data-max-width="506">下一轮：历史 A + 新图 B</text><g transform="translate(76 1493) scale(0.72)"><rect x="0" y="0" width="100" height="100" rx="10" fill="#fff" stroke="#555" stroke-width="1.5"/><rect x="7" y="7" width="86" height="66" rx="5" fill="#eee" stroke="none" stroke-width="1.5"/><circle cx="72" cy="27" r="8" fill="#8b8b8b"/><path d="M8 68L34 32l20 24 13-17 25 29Z" fill="#737373"/><path d="M8 68L34 49 53 68Z" fill="#bcbcbc"/><text x="50" y="94" font-size="21" font-weight="650" text-anchor="middle" fill="#171717">A</text></g><text x="180" y="1525" font-size="24" font-weight="400" text-anchor="start" fill="#171717" data-max-width="468">匹配历史映射 → 复用 file_A</text><g transform="translate(76 1581) scale(0.72)"><rect x="0" y="0" width="100" height="100" rx="10" fill="#fff" stroke="#555" stroke-width="1.5"/><rect x="7" y="7" width="86" height="66" rx="5" fill="#eee" stroke="none" stroke-width="1.5"/><path d="M16 69V36h21v33M43 69V17h27v52M76 69V43h14v26" fill="#7b7b7b"/><path d="M49 25h15M49 35h15M49 45h15" stroke="#f3f3f3" stroke-width="4"/><text x="50" y="94" font-size="21" font-weight="650" text-anchor="middle" fill="#171717">B</text></g><text x="180" y="1613" font-size="24" font-weight="400" text-anchor="start" fill="#171717" data-max-width="468">仅新图 B 调用 /files → file_B</text><rect x="72" y="1673" width="576" height="46" rx="9" fill="#f0f0f0" stroke="#cecece" stroke-width="1.5"/><text x="360" y="1704" font-size="25" font-weight="650" text-anchor="middle" fill="#171717" data-max-width="560" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">/responses · file_A + file_B</text><path d="M360 1755L360 1790" fill="none" stroke="#363636" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="1810" width="624" height="256" rx="16" fill="#fff" stroke="#999" stroke-width="1.5"/><rect x="72" y="1834" width="50" height="46" rx="9" fill="#f0f0f0" stroke="#cecece" stroke-width="1.5"/><text x="97" y="1865" font-size="24" font-weight="650" text-anchor="middle" fill="#171717" data-max-width="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">6</text><text x="142" y="1867" font-size="27" font-weight="650" text-anchor="start" fill="#171717" data-max-width="506">映射到期：回到上传步骤</text><text x="72" y="1924" font-size="24" font-weight="400" text-anchor="start" fill="#171717" data-max-width="576">下次 A 再出现时，旧映射失效 → 重新上传</text><rect x="72" y="1954" width="576" height="46" rx="9" fill="#f0f0f0" stroke="#cecece" stroke-width="1.5"/><text x="360" y="1985" font-size="24" font-weight="650" text-anchor="middle" fill="#171717" data-max-width="560" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">POST /files → file_A2 → /responses</text><text x="72" y="2034" font-size="22" font-weight="400" text-anchor="start" fill="#626262" data-max-width="576">重启保留映射；删除远端文件不会自动修复</text><text x="48" y="2122" font-size="21" font-weight="400" text-anchor="start" fill="#626262" data-max-width="624">默认请求 30 天有效期；以 DS 返回的过期时间为准。</text><text x="48" y="2157" font-size="21" font-weight="400" text-anchor="start" fill="#626262" data-max-width="624">仅改写发给 DS 的请求，Codex 本地历史不变。</text></svg>
