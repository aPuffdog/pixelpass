<svg xmlns="http://www.w3.org/2000/svg" width="720" height="2200" viewBox="0 0 720 2200" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">From first image to reuse and expiration</title><desc id="desc">Schematic lifecycle. A and B identify exact image bytes; file_A and file_B are illustrative IDs returned by DeepSeek, not image hashes.</desc>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto" markerUnits="strokeWidth"><path d="M1 1L11 6 1 11Z" fill="#363636"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif}svg{color-scheme:light}</style>
<rect width="720" height="2200" fill="#fff"/><text x="48" y="48" font-size="20" font-weight="650" text-anchor="start" fill="#626262">DEEPSEEK IMAGE CACHE PROXY</text><text x="48" y="112" font-size="35" font-weight="650" text-anchor="start" fill="#171717" data-max-width="624">First upload → history reuse</text><text x="48" y="154" font-size="20.901763568096484" font-weight="400" text-anchor="start" fill="#626262" data-max-width="624">Follow two requests using the same A and a new B. IDs are illustrative.</text><rect x="48" y="200" width="624" height="230" rx="16" fill="#fff" stroke="#999" stroke-width="1.5"/><rect x="72" y="224" width="50" height="46" rx="9" fill="#f0f0f0" stroke="#cecece" stroke-width="1.5"/><text x="97" y="255" font-size="24" font-weight="650" text-anchor="middle" fill="#171717" data-max-width="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1</text><text x="142" y="256" font-size="27" font-weight="650" text-anchor="start" fill="#171717" data-max-width="506">First request: image A</text><g transform="translate(76 284) scale(0.88)"><rect x="0" y="0" width="100" height="100" rx="10" fill="#fff" stroke="#555" stroke-width="1.5"/><rect x="7" y="7" width="86" height="66" rx="5" fill="#eee" stroke="none" stroke-width="1.5"/><circle cx="72" cy="27" r="8" fill="#8b8b8b"/><path d="M8 68L34 32l20 24 13-17 25 29Z" fill="#737373"/><path d="M8 68L34 49 53 68Z" fill="#bcbcbc"/><text x="50" y="94" font-size="21" font-weight="650" text-anchor="middle" fill="#171717">A</text></g><text x="193" y="307" font-size="26" font-weight="400" text-anchor="start" fill="#171717" data-max-width="450" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Codex → localhost</text><text x="193" y="349" font-size="25" font-weight="400" text-anchor="start" fill="#171717" data-max-width="450">image_url carries Base64</text><text x="72" y="402" font-size="23" font-weight="400" text-anchor="start" fill="#171717" data-max-width="576">Decode → hash(A) → no local mapping yet</text><path d="M360 445L360 480" fill="none" stroke="#363636" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="500" width="624" height="230" rx="16" fill="#fff" stroke="#999" stroke-width="1.5"/><rect x="72" y="524" width="50" height="46" rx="9" fill="#f0f0f0" stroke="#cecece" stroke-width="1.5"/><text x="97" y="555" font-size="24" font-weight="650" text-anchor="middle" fill="#171717" data-max-width="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">2</text><text x="142" y="556" font-size="27" font-weight="650" text-anchor="start" fill="#171717" data-max-width="506">Upload: DS creates the file ID</text><g transform="translate(76 591) scale(0.76)"><rect x="0" y="0" width="100" height="100" rx="10" fill="#fff" stroke="#555" stroke-width="1.5"/><rect x="7" y="7" width="86" height="66" rx="5" fill="#eee" stroke="none" stroke-width="1.5"/><circle cx="72" cy="27" r="8" fill="#8b8b8b"/><path d="M8 68L34 32l20 24 13-17 25 29Z" fill="#737373"/><path d="M8 68L34 49 53 68Z" fill="#bcbcbc"/><text x="50" y="94" font-size="21" font-weight="650" text-anchor="middle" fill="#171717">A</text></g><text x="180" y="609" font-size="25" font-weight="400" text-anchor="start" fill="#171717" data-max-width="456" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Proxy → POST /files → DS</text><path d="M180 637L623 637" fill="none" stroke="#363636" stroke-width="2" marker-end="url(#arrow)"/><text x="180" y="683" font-size="25" font-weight="400" text-anchor="start" fill="#171717" data-max-width="456" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">DS → { "id": "file_A" }</text><text x="72" y="708" font-size="22" font-weight="400" text-anchor="start" fill="#626262" data-max-width="576">The image file is stored in the DeepSeek account</text><path d="M360 745L360 780" fill="none" stroke="#363636" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="800" width="624" height="230" rx="16" fill="#fff" stroke="#999" stroke-width="1.5"/><rect x="72" y="824" width="50" height="46" rx="9" fill="#f0f0f0" stroke="#cecece" stroke-width="1.5"/><text x="97" y="855" font-size="24" font-weight="650" text-anchor="middle" fill="#171717" data-max-width="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">3</text><text x="142" y="856" font-size="27" font-weight="650" text-anchor="start" fill="#171717" data-max-width="506">Save the mapping; rewrite the request</text><rect x="72" y="883" width="576" height="46" rx="9" fill="#f0f0f0" stroke="#cecece" stroke-width="1.5"/><text x="360" y="914" font-size="25" font-weight="650" text-anchor="middle" fill="#171717" data-max-width="560" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">hash(A) → file_A + expiresAt</text><text x="72" y="972" font-size="23" font-weight="400" text-anchor="start" fill="#171717" data-max-width="576">Cache is credential-scoped; no image bytes stored</text><text x="72" y="1008" font-size="23" font-weight="400" text-anchor="start" fill="#626262" data-max-width="576">The hash is a lookup key; DS returned file_A</text><path d="M360 1045L360 1080" fill="none" stroke="#363636" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="1100" width="624" height="230" rx="16" fill="#fff" stroke="#999" stroke-width="1.5"/><rect x="72" y="1124" width="50" height="46" rx="9" fill="#f0f0f0" stroke="#cecece" stroke-width="1.5"/><text x="97" y="1155" font-size="24" font-weight="650" text-anchor="middle" fill="#171717" data-max-width="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">4</text><text x="142" y="1156" font-size="27" font-weight="650" text-anchor="start" fill="#171717" data-max-width="506">Reference: DS still receives image A</text><rect x="72" y="1180" width="576" height="46" rx="9" fill="#f0f0f0" stroke="#cecece" stroke-width="1.5"/><text x="360" y="1211" font-size="24" font-weight="650" text-anchor="middle" fill="#171717" data-max-width="560" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">POST /responses · file_id: file_A</text><text x="72" y="1265" font-size="24" font-weight="400" text-anchor="start" fill="#171717" data-max-width="576">DS resolves the stored image → model input</text><text x="72" y="1305" font-size="23" font-weight="400" text-anchor="start" fill="#626262" data-max-width="576">The reply streams through the proxy to Codex</text><path d="M360 1345L360 1380" fill="none" stroke="#363636" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="1400" width="624" height="340" rx="16" fill="#f5f5f5" stroke="#999" stroke-width="1.5"/><rect x="72" y="1424" width="50" height="46" rx="9" fill="#f0f0f0" stroke="#cecece" stroke-width="1.5"/><text x="97" y="1455" font-size="24" font-weight="650" text-anchor="middle" fill="#171717" data-max-width="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">5</text><text x="142" y="1457" font-size="27" font-weight="650" text-anchor="start" fill="#171717" data-max-width="506">Next request: history A + new B</text><g transform="translate(76 1493) scale(0.72)"><rect x="0" y="0" width="100" height="100" rx="10" fill="#fff" stroke="#555" stroke-width="1.5"/><rect x="7" y="7" width="86" height="66" rx="5" fill="#eee" stroke="none" stroke-width="1.5"/><circle cx="72" cy="27" r="8" fill="#8b8b8b"/><path d="M8 68L34 32l20 24 13-17 25 29Z" fill="#737373"/><path d="M8 68L34 49 53 68Z" fill="#bcbcbc"/><text x="50" y="94" font-size="21" font-weight="650" text-anchor="middle" fill="#171717">A</text></g><text x="180" y="1525" font-size="24" font-weight="400" text-anchor="start" fill="#171717" data-max-width="468">Match prior mapping → reuse file_A</text><g transform="translate(76 1581) scale(0.72)"><rect x="0" y="0" width="100" height="100" rx="10" fill="#fff" stroke="#555" stroke-width="1.5"/><rect x="7" y="7" width="86" height="66" rx="5" fill="#eee" stroke="none" stroke-width="1.5"/><path d="M16 69V36h21v33M43 69V17h27v52M76 69V43h14v26" fill="#7b7b7b"/><path d="M49 25h15M49 35h15M49 45h15" stroke="#f3f3f3" stroke-width="4"/><text x="50" y="94" font-size="21" font-weight="650" text-anchor="middle" fill="#171717">B</text></g><text x="180" y="1613" font-size="24" font-weight="400" text-anchor="start" fill="#171717" data-max-width="468">Only new B uses /files → file_B</text><rect x="72" y="1673" width="576" height="46" rx="9" fill="#f0f0f0" stroke="#cecece" stroke-width="1.5"/><text x="360" y="1704" font-size="25" font-weight="650" text-anchor="middle" fill="#171717" data-max-width="560" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">/responses · file_A + file_B</text><path d="M360 1755L360 1790" fill="none" stroke="#363636" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="1810" width="624" height="256" rx="16" fill="#fff" stroke="#999" stroke-width="1.5"/><rect x="72" y="1834" width="50" height="46" rx="9" fill="#f0f0f0" stroke="#cecece" stroke-width="1.5"/><text x="97" y="1865" font-size="24" font-weight="650" text-anchor="middle" fill="#171717" data-max-width="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">6</text><text x="142" y="1867" font-size="27" font-weight="650" text-anchor="start" fill="#171717" data-max-width="506">Mapping expires: upload again</text><text x="72" y="1924" font-size="24" font-weight="400" text-anchor="start" fill="#171717" data-max-width="576">When A returns: expired mapping → re-upload</text><rect x="72" y="1954" width="576" height="46" rx="9" fill="#f0f0f0" stroke="#cecece" stroke-width="1.5"/><text x="360" y="1985" font-size="24" font-weight="650" text-anchor="middle" fill="#171717" data-max-width="560" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">POST /files → file_A2 → /responses</text><text x="72" y="2034" font-size="21.89014548300899" font-weight="400" text-anchor="start" fill="#626262" data-max-width="576">Restart keeps mappings; remote deletion is not auto-repaired</text><text x="48" y="2122" font-size="21" font-weight="400" text-anchor="start" fill="#626262" data-max-width="624">Requests a 30-day TTL by default; DS expiry takes precedence.</text><text x="48" y="2157" font-size="21" font-weight="400" text-anchor="start" fill="#626262" data-max-width="624">Only the outbound request changes; Codex history stays intact.</text></svg>
