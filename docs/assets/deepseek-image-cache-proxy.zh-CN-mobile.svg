<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1440" viewBox="0 0 720 1440" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">历史图片，下一轮继续用原来的文件</title><desc id="desc">生命周期示意。A、B 表示图片字节，file_A、file_B 仅为 DeepSeek 返回 ID 的示例，并非图片哈希。</desc>
