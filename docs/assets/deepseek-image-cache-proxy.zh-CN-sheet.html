<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeepSeek 图片缓存代理 - 结构图</title>
  <style>
    :root { color-scheme: light; --paper: #ececec; --ink: #111; --ink2: #4b4b4b; --ink3: #777; --sheet: #fff; --fill: #f2f2f2; --fill2: #e4e4e4; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: Arial, "PingFang SC", sans-serif; }
    .wrap { max-width: 1760px; margin: 0 auto; padding: 24px 16px 40px; }
    .title-block { background: var(--sheet); border: 1.2px solid var(--ink); border-radius: 12px; overflow: hidden; display: grid; grid-template-columns: 2.4fr 1fr 1fr 1fr 1fr; margin-bottom: 20px; }
    .title-block > div { min-height: 52px; padding: 9px 12px; border-right: .8px solid var(--ink); border-bottom: .8px solid var(--ink); }
    .title-block > div:nth-child(5), .title-block > div:last-child { border-right: 0; }
    .title { grid-row: span 2; display: flex; flex-direction: column; justify-content: space-between; }
    .label { font-size: 10px; color: var(--ink2); letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 4px 0 0; font-size: clamp(24px, 3vw, 38px); line-height: 1; font-weight: 400; letter-spacing: .06em; }
    .value { margin-top: 5px; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; }
    .notes { grid-column: 1 / -1; border-right: 0 !important; border-bottom: 0 !important; font-size: 11px; line-height: 1.6; text-transform: uppercase; letter-spacing: .05em; }
    .scroll { background: var(--sheet); overflow-x: auto; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
    svg { display: block; width: 100%; min-width: 1100px; height: auto; }
    .foot { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-top: 9px; font-size: 11px; color: var(--ink2); letter-spacing: .06em; text-transform: uppercase; }
    .foot b { color: var(--ink); }
  </style>
</head>
<body>
<div class="wrap">
  <header class="title-block">
    <div class="title">
      <div><div class="label">系统架构 · 结构图</div><h1>DEEPSEEK 图片缓存代理</h1></div>
      <div class="label">为 CODEX 图片请求提供本机 RESPONSES API 中转</div>
    </div>
    <div><div class="label">图号</div><div class="value">DIP-001</div></div>
    <div><div class="label">版本</div><div class="value">A · 2026-10-27</div></div>
    <div><div class="label">页数</div><div class="value">1</div></div>
    <div><div class="label">单位</div><div class="value">示意图</div></div>
    <div class="notes"><b>说明：</b>箭头表示请求流向 · 灰色区域表示架构槽位 · 图片按 SHA-256 去重 · 代理保存文件引用，不保存 prompt 文本或图片字节 · 实测数据来自一次长期图片会话，效果会随缓存命中率变化。</div>
  </header>

  <div class="scroll">
    <svg viewBox="0 0 1600 930" role="img" aria-labelledby="title desc">
      <title id="title">DeepSeek 图片缓存代理结构图</title>
      <desc id="desc">黑白结构图：Codex 内联图片进入本机缓存代理，转换为 DeepSeek file_id，并将 256 MiB 请求降低到 2.1 MiB。</desc>
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 Z" fill="#111"/></marker>
        <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V7" stroke="#888" stroke-width="1"/></pattern>
        <style>
          .border{fill:none;stroke:#111;stroke-width:1.2}.obj{fill:#fff;stroke:#111;stroke-width:1.6}.well{fill:#f2f2f2;stroke:#111;stroke-width:1}.slot{fill:none;stroke:#4b4b4b;stroke-width:.9;stroke-dasharray:5 4}.soft{fill:#e4e4e4;stroke:#111;stroke-width:1}.thin{fill:none;stroke:#111;stroke-width:.8}.dash{fill:none;stroke:#777;stroke-width:.8;stroke-dasharray:12 4 2 4}.dim{fill:none;stroke:#111;stroke-width:.7;marker-start:url(#arrow);marker-end:url(#arrow)}.ext{fill:none;stroke:#111;stroke-width:.55}.lead{fill:none;stroke:#111;stroke-width:.7}.txt{font:400 13px Arial,"PingFang SC",sans-serif;fill:#111}.small{font:400 10px Arial,"PingFang SC",sans-serif;fill:#4b4b4b;letter-spacing:.08em}.caps{font:400 12px Arial,"PingFang SC",sans-serif;fill:#111;letter-spacing:.09em}.big{font:400 23px Arial,"PingFang SC",sans-serif;fill:#111;letter-spacing:.04em}.metric{font:400 30px Arial,"PingFang SC",sans-serif;fill:#111;letter-spacing:.02em}.note{fill:#fff;stroke:#111;stroke-width:.9}.table-head{font:700 10px Arial,"PingFang SC",sans-serif;fill:#111;letter-spacing:.08em}.table-cell{font:400 11px Arial,"PingFang SC",sans-serif;fill:#111}
        </style>
      </defs>

      <rect x="0" y="0" width="1600" height="930" fill="#fff"/>
      <rect x="30" y="24" width="1540" height="882" rx="14" class="border"/>
      <text x="60" y="62" class="caps">说明：[1] 长 Codex 会话会反复携带 Base64 图片历史。[2] 只改变请求表示方式。[3] 后续请求复用 file_id 引用。</text>
      <text x="60" y="82" class="caps">[4] 本机监听：127.0.0.1:17892。[5] 默认入口上限：1 GiB。[6] 尺寸和结构为示意。</text>

      <rect x="60" y="118" width="1480" height="2" fill="#111"/>
      <text x="80" y="160" class="small">主视图 · 请求转换流程 · 比例 0.9:1</text>
      <text x="1504" y="160" text-anchor="end" class="small">关键变量见下方</text>

      <!-- left: source request -->
      <rect x="110" y="215" width="350" height="300" rx="12" class="obj"/>
      <text x="135" y="250" class="big">CODEX 请求</text>
      <text x="135" y="275" class="small">内联图片历史 · INPUT_IMAGE</text>
      <rect x="135" y="308" width="300" height="105" rx="8" class="well"/>
      <rect x="155" y="328" width="48" height="64" rx="4" fill="url(#hatch)" stroke="#111"/>
      <rect x="217" y="328" width="48" height="64" rx="4" fill="url(#hatch)" stroke="#111"/>
      <rect x="279" y="328" width="48" height="64" rx="4" fill="url(#hatch)" stroke="#111"/>
      <rect x="341" y="328" width="48" height="64" rx="4" fill="url(#hatch)" stroke="#111"/>
      <text x="155" y="432" class="caps">BASE64 × 183 张图片</text>
      <text x="135" y="474" class="txt">请求体会先于模型上下文达到上限。</text>
      <rect x="135" y="548" width="300" height="64" rx="8" class="soft"/>
      <text x="155" y="575" class="small">上游失败</text>
      <text x="155" y="600" class="metric">256 MiB  /  413</text>
      <rect x="72" y="202" width="18" height="18" class="note"/><text x="81" y="216" text-anchor="middle" class="table-cell">1</text>

      <!-- center: proxy -->
      <rect x="625" y="190" width="350" height="370" rx="12" class="obj"/>
      <text x="650" y="228" class="big">本机缓存</text>
      <text x="650" y="253" class="small">127.0.0.1:17892 · 请求改写</text>
      <rect x="650" y="285" width="300" height="58" rx="8" class="slot"/>
      <text x="800" y="320" text-anchor="middle" class="caps">SHA-256 去重 · 查询缓存</text>
      <line x1="800" y1="343" x2="800" y2="370" class="lead" marker-end="url(#arrow)"/>
      <rect x="650" y="385" width="300" height="70" rx="8" class="well"/>
      <text x="670" y="414" class="small">首次出现的图片</text>
      <text x="670" y="441" class="txt">DeepSeek Files API  ->  file_id</text>
      <line x1="800" y1="455" x2="800" y2="482" class="lead" marker-end="url(#arrow)"/>
      <rect x="650" y="497" width="300" height="40" rx="8" class="soft"/>
      <text x="800" y="523" text-anchor="middle" class="caps">内联数据替换为引用</text>
      <rect x="587" y="177" width="18" height="18" class="note"/><text x="596" y="191" text-anchor="middle" class="table-cell">2</text>

      <!-- right: upstream -->
      <rect x="1140" y="215" width="350" height="300" rx="12" class="obj"/>
      <text x="1165" y="250" class="big">DEEPSEEK</text>
      <text x="1165" y="275" class="small">RESPONSES API · 小请求</text>
      <rect x="1165" y="308" width="300" height="105" rx="8" class="well"/>
      <rect x="1190" y="333" width="72" height="54" rx="5" class="soft"/>
      <text x="1226" y="366" text-anchor="middle" class="small">FILE_ID</text>
      <line x1="1285" y1="360" x2="1315" y2="360" class="lead" marker-end="url(#arrow)"/>
      <text x="1338" y="354" class="caps">只发送引用</text>
      <text x="1338" y="378" class="small">不重复发送图片字节</text>
      <text x="1165" y="450" class="txt">视觉输入不变，HTTP 请求更小。</text>
      <rect x="1165" y="548" width="300" height="64" rx="8" class="soft"/>
      <text x="1185" y="575" class="small">实测请求</text>
      <text x="1185" y="600" class="metric">2.1 MiB  /  OK</text>
      <rect x="1110" y="202" width="18" height="18" class="note"/><text x="1119" y="216" text-anchor="middle" class="table-cell">3</text>

      <!-- flow arrows -->
      <line x1="465" y1="365" x2="612" y2="365" class="dim"/>
      <text x="538" y="348" text-anchor="middle" class="small">POST /RESPONSES</text>
      <line x1="985" y1="365" x2="1127" y2="365" class="dim"/>
      <text x="1056" y="348" text-anchor="middle" class="small">FILE_ID 请求</text>

      <!-- dimensions -->
      <text x="800" y="642" text-anchor="middle" class="small">请求流向 · 示意图（非按比例）</text>

      <!-- measured results -->
      <text x="80" y="708" class="small">实测结果 · 一次长期图片会话</text>
      <rect x="80" y="728" width="420" height="110" rx="8" class="obj"/>
      <text x="105" y="760" class="small">最近一次请求 · 183 张图片</text>
      <text x="105" y="803" class="metric">256 MiB  ->  2.1 MiB</text>
      <text x="475" y="803" text-anchor="end" class="small">-99.2%</text>
      <rect x="530" y="728" width="420" height="110" rx="8" class="obj"/>
      <text x="555" y="760" class="small">累计 · 455 次请求</text>
      <text x="555" y="803" class="metric">73.6 GiB  ->  632.8 MiB</text>
      <rect x="980" y="728" width="560" height="110" rx="8" class="obj"/>
      <text x="1005" y="760" class="small">缓存复用 · 同一账户</text>
      <text x="1005" y="803" class="metric">52,382 次图片引用</text>

      <!-- variable table -->
      <text x="80" y="874" class="small">关键变量</text>
      <text x="80" y="896" class="table-cell">S1  图片 SHA-256 键  ·  H1  file_id 替换  ·  L1  1 GiB 本机请求入口上限（托管模式）</text>
      <text x="1520" y="896" text-anchor="end" class="small">日期 2026-10-27  |  第 1 页 / 共 1 页</text>
    </svg>
  </div>
  <div class="foot"><span>2026-10-27 &nbsp;|&nbsp; 系统架构参考图</span><span><b>DeepSeek 图片缓存代理</b> &nbsp;|&nbsp; 1</span></div>
</div>
</body>
</html>
