ly="ui-monospace, SFMono-Regular, Menlo, monospace">A → file_A</text><text x="484" y="569" font-size="23" font-weight="400" text-anchor="start" fill="#171717" data-max-width="252">已上传：命中并复用</text><text x="484" y="626" font-size="23" font-weight="650" text-anchor="start" fill="#171717" data-max-width="252" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">B → /files → file_B</text><text x="484" y="674" font-size="23" font-weight="400" text-anchor="start" fill="#171717" data-max-width="252">新图片：上传后存映射</text><text x="484" y="718" font-size="20" font-weight="400" text-anchor="start" fill="#626262" data-max-width="252">哈希 ≠ DS 返回的文件 ID</text><path d="M778 571L852 571" fill="none" stroke="#363636" stroke-width="2" marker-end="url(#arrow)"/><text x="815" y="531" font-size="19" font-weight="400" text-anchor="middle" fill="#171717">文件引用</text><text x="894" y="445" font-size="26" font-weight="650" text-anchor="start" fill="#171717">DeepSeek</text><text x="894" y="482" font-size="22" font-weight="400" text-anchor="start" fill="#626262">POST /responses</text><rect x="894" y="516" width="106" height="46" rx="9" fill="#f0f0f0" stroke="#cecece" stroke-width="1.5"/><text x="947" y="547" font-size="20" font-weight="650" text-anchor="middle" fill="#171717" data-max-width="90" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">file_A</text><rect x="1020" y="516" width="108" height="46" rx="9" fill="#f0f0f0" stroke="#cecece" stroke-width="1.5"/><text x="1074" y="547" font-size="20" font-weight="650" text-anchor="middle" fill="#171717" data-max-width="92" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">file_B</text><g transform="translate(916 585) scale(0.68)"><rect x="0" y="0" width="100" height="100" rx="10" fill="#fff" stroke="#555" stroke-width="1.5"/><rect x="7" y="7" width="86" height="66" rx="5" fill="#eee" stroke="none" stroke-width="1.5"/><circle cx="72" cy="27" r="8" fill="#8b8b8b"/><path d="M8 68L34 32l20 24 13-17 25 29Z" fill="#737373"/><path d="M8 68L34 49 53 68Z" fill="#bcbcbc"/><text x="50" y="94" font-size="21" font-weight="650" text-anchor="middle" fill="#171717">A</text></g><g transform="translate(1034 585) scale(0.68)"><rect x="0" y="0" width="100" height="100" rx="10" fill="#fff" stroke="#555" stroke-width="1.5"/><rect x="7" y="7" width="86" height="66" rx="5" fill="#eee" stroke="none" stroke-width="1.5"/><path d="M16 69V36h21v33M43 69V17h27v52M76 69V43h14v26" fill="#7b7b7b"/><path d="M49 25h15M49 35h15M49 45h15" stroke="#f3f3f3" stroke-width="4"/><text x="50" y="94" font-size="21" font-weight="650" text-anchor="middle" fill="#171717">B</text></g><text x="894" y="695" font-size="22" font-weight="400" text-anchor="start" fill="#171717" data-max-width="234">读取已存的 A、B 文件</text><text x="894" y="731" font-size="19" font-weight="400" text-anchor="start" fill="#626262" data-max-width="234">图片上下文保持完整</text><path d="M48 804L1152 804" fill="none" stroke="#363636" stroke-width="2"/><text x="48" y="869" font-size="42" font-weight="650" text-anchor="start" fill="#171717">256 MiB → 2.1 MiB</text><text x="670" y="861" font-size="22" font-weight="400" text-anchor="start" fill="#171717" data-max-width="482">一次实测：上游 Responses 体积减少约 99.2%</text><text x="48" y="914" font-size="22" font-weight="400" text-anchor="start" fill="#626262" data-max-width="1104">首次 /files 上传单独计算；本机段仍携带 Base64；有效缓存期内复用。</text></svg>
