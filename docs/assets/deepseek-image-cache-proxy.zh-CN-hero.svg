<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">历史图片，下一轮继续用原来的文件</title><desc id="desc">生命周期示意。A、B 表示图片字节，file_A、file_B 仅为 DeepSeek 返回 ID 的示例，并非图片哈希。</desc>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto" markerUnits="strokeWidth"><path d="M1 1L11 6 1 11Z" fill="#363636"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif}svg{color-scheme:light}</style>
<rect width="1200" height="950" fill="#fff"/><text x="48" y="48" font-size="19" font-weight="650" text-anchor="start" fill="#626262">DEEPSEEK IMAGE CACHE PROXY</text><text x="48" y="112" font-size="40" font-weight="650" text-anchor="start" fill="#171717" data-max-width="1104">历史图片，下一轮继续用原来的文件</text><text x="48" y="154" font-size="25" font-weight="400" text-anchor="start" fill="#626262" data-max-width="1104">DS 已有文件引用能力；代理帮 Codex 接上这套流程。</text><rect x="48" y="190" width="1104" height="120" rx="16" fill="#f5f5f5" stroke="#dedede" stroke-width="1.5"/><text x="72" y="228" font-size="23" font-weight="650" text-anchor="start" fill="#171717">DS 原生就支持</text><text x="190" y="277" font-size="25" font-weight="400" text-anchor="middle" fill="#171717" data-max-width="232">上传图片</text><path d="M310 269L331 269" fill="none" stroke="#363636" stroke-width="2" marker-end="url(#arrow)"/><text x="465" y="277" font-size="25" font-weight="400" text-anchor="middle" fill="#171717" data-max-width="232">POST /files</text><path d="M585 269L606 269" fill="none" stroke="#363636" stroke-width="2" marker-end="url(#arrow)"/><text x="740" y="277" font-size="25" font-weight="650" text-anchor="middle" fill="#171717" data-max-width="232">DS 返回 id</text><path d="M860 269L881 269" fill="none" stroke="#363636" stroke-width="2" marker-end="url(#arrow)"/><text x="1015" y="277" font-size="25" font-weight="400" text-anchor="middle" fill="#171717" data-max-width="232">/responses 用 id</text><text x="48" y="365" font-size="25" font-weight="400" text-anchor="start" fill="#171717" data-max-width="1104">接入缺口：Codex 当前路径发送 Base64，代理补齐 DS 文件上传与引用复用。</text><rect x="48" y="402" width="302" height="360" rx="16" fill="#fff" stroke="#555" stroke-width="1.5"/><rect x="460" y="402" width="300" height="360" rx="16" fill="#f7f7f7" stroke="#555" stroke-width="1.5"/><rect x="870" y="402" width="282" height="360" rx="16" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="72" y="445" font-size="25" font-weight="650" text-ancho