<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1500" viewBox="0 0 800 1500" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek Image Cache Proxy: repeated images, lighter requests</title>
  <desc id="desc">Repeated Codex images are identified by a local cache, uploaded once when first seen, then reused as file_id references. One observed request fell from 256 MiB to 2.1 MiB.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f7ff"/><stop offset="1" stop-color="#f4f8fb"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5069db"/><stop offset="1" stop-color="#7587ed"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1a2750" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#7682a6"/></marker>
    <style>
      .ink{fill:#17213d}.muted{fill:#65708a}.line{stroke:#7e89a6;stroke-width:4;fill:none;stroke-linecap:round}.card{fill:#fff;stroke:#e1e6f1;stroke-width:2}.label{font:700 26px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:2px;fill:#435178}.body{font:500 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#4d5874}.small{font:500 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#69748e}.mono{font:700 27px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#293654}.big{font:700 54px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17213d}.white{fill:#fff}
    </style>
  </defs>
  <rect width="800" height="1500" fill="url(#bg)"/>
  <rect x="24" y="24" width="752" height="1452" rx="38" fill="#fff" stroke="#e5e9f2" stroke-width="2"/>

  <text x="64" y="96" class="label">DEEPSEEK IMAGE CACHE PROXY</text>
  <text x="64" y="158" class="big">Repeat images. Not uploads.</text>
  <text x="64" y="204" class="small">Keep image-heavy conversations lightweight</text>

  <!-- Repeated visual inputs -->
  <g filter="url(#shadow)">
    <rect x="92" y="264" width="272" height="228" rx="24" class="card" transform="rotate(-7 228 378)"/>
    <rect x="250" y="258" width="272" height="228" rx="24" class="card" transform="rotate(5 386 372)"/>
    <rect x="430" y="264" width="272" height="228" rx="24" class="card" transform="rotate(-3 566 378)"/>
  </g>
  <g transform="translate(288 305)">
    <rect width="224" height="148" rx="15" fill="#eaf0ff"/>
    <circle cx="165" cy="42" r="18" fill="#f1c775"/>
    <path d="M14 128L76 67l41 39 29-27 64 49Z" fill="#7f99d8"/>
    <path d="M14 130L89 87l48 43Z" fill="#91b6a6"/>
    <rect x="25" y="158" width="174" height="7" rx="3.5" fill="#dce2ef"/>
    <rect x="55" y="173" width="114" height="7" rx="3.5" fill="#e9edf4"/>
  </g>
  <rect x="292" y="482" width="216" height="54" rx="27" fill="#edf0ff"/>
  <text x="400" y="518" text-anchor="middle" class="mono">Same image, again</text>
  <text x="400" y="578" text-anchor="middle" class="body">Long Codex histories grow request bodies</text>

  <path d="M400 606V658" class="line" marker-end="url(#arrow)"/>

  <!-- Local cache -->
  <g filter="url(#shadow)">
    <rect x="88" y="684" width="624" height="300" rx="30" class="card"/>
  </g>
  <rect x="124" y="720" width="68" height="68" rx="22" fill="url(#accent)"/>
  <path d="M141 754h34M158 737v34M146 742l24 24M170 742l-24 24" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <text x="214" y="752" class="label">LOCAL CACHE</text>
  <text x="214" y="790" class="small">SHA-256 finds identical images</text>
  <line x1="124" y1="820" x2="676" y2="820" stroke="#e8ebf2" stroke-width="2"/>
  <g>
    <rect x="128" y="850" width="216" height="86" rx="18" fill="#f5f6fa"/>
    <text x="236" y="883" text-anchor="middle" class="small">First seen</text>
    <text x="236" y="918" text-anchor="middle" class="mono">Upload once</text>
    <path d="M360 893h78" class="line" marker-end="url(#arrow)"/>
    <rect x="456" y="850" width="216" height="86" rx="18" fill="#edf0ff"/>
    <text x="564" y="883" text-anchor="middle" class="small">Seen again</text>
    <text x="564" y="918" text-anchor="middle" class="mono">Reuse file_id</text>
  </g>

  <path d="M400 1000V1052" class="line" marker-end="url(#arrow)"/>

  <!-- Lightweight request -->
  <rect x="112" y="1076" width="576" height="116" rx="26" fill="#17213d"/>
  <circle cx="166" cy="1134" r="25" fill="url(#accent)"/>
  <path d="M154 1135l9 9 17-20" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="210" y="1128" class="white" style="font:700 28px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">DeepSeek Responses</text>
  <text x="210" y="1165" class="white" style="font:500 24px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;opacity:.78">Subsequent requests carry small references</text>

  <text x="64" y="1256" class="small">One observed request from a long image session</text>
  <text x="64" y="1334" class="big">256 MiB</text>
  <path d="M310 1314h74" stroke="#596fd6" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="412" y="1334" class="big">2.1 MiB</text>
  <rect x="64" y="1370" width="228" height="58" rx="29" fill="#edf0ff"/>
  <text x="178" y="1408" text-anchor="middle" style="font:700 26px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#465fc9">~99.2% smaller</text>
  <text x="312" y="1408" class="small">Same images. Less repeated data.</text>
  <text x="64" y="1450" class="small">Observed once; savings depend on image reuse.</text>
</svg>
