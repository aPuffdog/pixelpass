<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">History images. Reuse the uploaded file.</title><desc id="desc">Schematic lifecycle. A and B identify exact image bytes; file_A and file_B are illustrative IDs returned by DeepSeek, not image hashes.</desc>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto" markerUnits="strokeWidth"><path d="M1 1L11 6 1 11Z" fill="#363636"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif}svg{color-scheme:light}</style>
<rect width="1200" height="950" fill="#fff"/><text x="48" y="48" font-size="19" font-weight="650" text-anchor="start" fill="#626262">DEEPSEEK IMAGE CACHE PROXY</text><text x="48" y="112" font-size="40" font-weight="650" text-anchor="start" fill="#171717" data-max-width="1104">History images. Reuse the uploaded file.</text><text x="48" y="154" font-size="25" font-weight="400" text-anchor="start" fill="#626262" data-max-width="1104">DeepSeek has file references. The proxy connects Codex to that workflow.</text><rect x="48" y="190" width="1104" height="120" rx="16" fill="#f5f5f5" stroke="#dedede" stroke-width="1.5"/><text x="72" y="228" font-size="23" font-weight="650" text-anchor="start" fill="#171717">Native to DeepSeek</text><text x="190" y="277" font-size="25" font-weight="400" text-anchor="middle" fill="#171717" data-max-width="232">Upload image</text><path d="M310 269L331 269" fill="none" stroke="#363636" stroke-width="2" marker-end="url(#arrow)"/><text x="465" y="277" font-size="25" font-weight="400" text-anchor="middle" fill="#171717" data-max-width="232">POST /files</text><path d="M585 269L606 269" fill="none" stroke="#363636" stroke-width="2" marker-end="url(#arrow)"/><text x="740" y="277" font-size="25" font-weight="650" text-anchor="middle" fill="#171717" data-max-width="232">DS returns ID</text><path d="M860 269L881 269" fill="none" stroke="#363636" stroke-width="2" marker-end="url(#arrow)"/><text x="1015" y="277" font-size="25" font-weight="400" text-anchor="middle" fill="#171717" data-max-width="232">Use ID in /responses</text><text x="48" y="365" font-size="25" font-weight="400" text-anchor="start" fill="#171717" data-max-width="1104">The gap: Codex's observed inline-data path does not orchestrate DS file uploads and reuse.</text><rect x="48" y="402" width="302" height="360" rx="16" fill="#fff" stroke="#555" stroke-width="1.5"/><rect x="460" y="402" width="300" height="360" rx="16" fill="#f7f7f7" stroke="#555" stroke-width="1.5"/><rect x="870" y="402" width="282" height="360" rx="16" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="72" y="445" font-size="25" font-weight="650" text-anchor="start" fill="#171717">Current Codex request</text><g transform="translate(80 472) scale(0.94)"><rect x="0" y="0" width="100" height="100" rx="10" fill="#fff" stroke="#555" stroke-width="1.5"/><rect x="7" y="7" width="86" height="66" rx="5" fill="#eee" stroke="none" stroke-width="1.5"/><circle cx="72" cy="27" r="8" fill="#8b8b8b"/><path d="M8 68L34 32l20 24 13-17 25 29Z" fill="#737373"/><path d="M8 68L34 49 53 68Z" fill="#bcbcbc"/><text x="50" y="94" font-size="21" font-weight="650" text-anchor="middle" fill="#171717">A</text></g><g transform="translate(220 472) scale(0.94)"><rect x="0" y="0" width="100" height="100" rx="10" fill="#fff" stroke="#555" stroke-width="1.5"/><rect x="7" y="7" width="86" height="66" rx="5" fill="#eee" stroke="none" stroke-width="1.5"/><path d="M16 69V36h21v33M43 69V17h27v52M76 69V43h14v26" fill="#7b7b7b"/><path d="M49 25h15M49 35h15M49 45h15" stroke="#f3f3f3" stroke-width="4"/><text x="50" y="94" font-size="21" font-weight="650" text-anchor="middle" fill="#171717">B</text></g><text x="127" y="605" font-size="23" font-weight="650" text-anchor="middle" fill="#171717">History A</text><text x="267" y="605" font-size="23" font-weight="650" text-anchor="middle" fill="#171717">New B</text><text x="72" y="667" font-size="23" font-weight="400" text-anchor="start" fill="#171717" data-max-width="253">A was uploaded earlier</text><text x="72" y="710" font-size="21" font-weight="400" text-anchor="start" fill="#626262" data-max-width="253">Still sends full image data</text><path d="M367 571L443 571" fill="none" stroke="#363636" stroke-width="2" marker-end="url(#arrow)"/><text x="405" y="531" font-size="19" font-weight="400" text-anchor="middle" fill="#171717">Full data</text><text x="484" y="445" font-size="25" font-weight="650" text-anchor="start" fill="#171717">Local cache proxy</text><rect x="484" y="487" width="252" height="46" rx="9" fill="#f0f0f0" stroke="#cecece" stroke-width="1.5"/><text x="610" y="518" font-size="24" font-weight="650" text-anchor="middle" fill="#171717" data-max-width="236" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">A → file_A</text><text x="484" y="569" font-size="23" font-weight="400" text-anchor="start" fill="#171717" data-max-width="252">Existing: cache hit</text><text x="484" y="626" font-size="23" font-weight="650" text-anchor="start" fill="#171717" data-max-width="252" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">B → /files → file_B</text><text x="484" y="674" font-size="23" font-weight="400" text-anchor="start" fill="#171717" data-max-width="252">New: upload + cache ID</text><text x="484" y="718" font-size="20" font-weight="400" text-anchor="start" fill="#626262" data-max-width="252">Image hash ≠ server file ID</text><path d="M778 571L852 571" fill="none" stroke="#363636" stroke-width="2" marker-end="url(#arrow)"/><text x="815" y="531" font-size="19" font-weight="400" text-anchor="middle" fill="#171717">File IDs</text><text x="894" y="445" font-size="26" font-weight="650" text-anchor="start" fill="#171717">DeepSeek</text><text x="894" y="482" font-size="22" font-weight="400" text-anchor="start" fill="#626262">POST /responses</text><rect x="894" y="516" width="106" height="46" rx="9" fill="#f0f0f0" stroke="#cecece" stroke-width="1.5"/><text x="947" y="547" font-size="20" font-weight="650" text-anchor="middle" fill="#171717" data-max-width="90" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">file_A</text><rect x="1020" y="516" width="108" height="46" rx="9" fill="#f0f0f0" stroke="#cecece" stroke-width="1.5"/><text x="1074" y="547" font-size="20" font-weight="650" text-anchor="middle" fill="#171717" data-max-width="92" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">file_B</text><g transform="translate(916 585) scale(0.68)"><rect x="0" y="0" width="100" height="100" rx="10" fill="#fff" stroke="#555" stroke-width="1.5"/><rect x="7" y="7" width="86" height="66" rx="5" fill="#eee" stroke="none" stroke-width="1.5"/><circle cx="72" cy="27" r="8" fill="#8b8b8b"/><path d="M8 68L34 32l20 24 13-17 25 29Z" fill="#737373"/><path d="M8 68L34 49 53 68Z" fill="#bcbcbc"/><text x="50" y="94" font-size="21" font-weight="650" text-anchor="middle" fill="#171717">A</text></g><g transform="translate(1034 585) scale(0.68)"><rect x="0" y="0" width="100" height="100" rx="10" fill="#fff" stroke="#555" stroke-width="1.5"/><rect x="7" y="7" width="86" height="66" rx="5" fill="#eee" stroke="none" stroke-width="1.5"/><path d="M16 69V36h21v33M43 69V17h27v52M76 69V43h14v26" fill="#7b7b7b"/><path d="M49 25h15M49 35h15M49 45h15" stroke="#f3f3f3" stroke-width="4"/><text x="50" y="94" font-size="21" font-weight="650" text-anchor="middle" fill="#171717">B</text></g><text x="894" y="695" font-size="22" font-weight="400" text-anchor="start" fill="#171717" data-max-width="234">Resolves stored A and B</text><text x="894" y="731" font-size="19" font-weight="400" text-anchor="start" fill="#626262" data-max-width="234">Both images stay in context</text><path d="M48 804L1152 804" fill="none" stroke="#363636" stroke-width="2"/><text x="48" y="869" font-size="42" font-weight="650" text-anchor="start" fill="#171717">256 MiB → 2.1 MiB</text><text x="670" y="861" font-size="19.220482030077317" font-weight="400" text-anchor="start" fill="#171717" data-max-width="482">One observed upstream Responses body: ~99.2% smaller</text><text x="48" y="914" font-size="22" font-weight="400" text-anchor="start" fill="#626262" data-max-width="1104">Initial /files uploads are separate. The local hop still carries Base64. Reuse lasts while the cache is valid.</text></svg>
