<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">一张图片从出现到过期的完整路径</title><desc id="desc">生命周期示意。A、B 表示图片字节，file_A、file_B 仅为 DeepSeek 返回 ID 的示例，并非图片哈希。</desc>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto" markerUnits="strokeWidth"><path d="M1 1L11 6 1 11Z" fill="#363636"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif}svg{color-scheme:light}</style>
<rect width="1200" height="1800" fill="#fff"/><text x="48" y="48" font-size="19" font-weight="650" text-anchor="start" fill="#626262">DEEPSEEK IMAGE CACHE PROXY</text><text x="48" y="112" font-size="40" font-weight="650" text-anchor="start" fill="#171717" data-max-width="1104">一张图片从出现到过期的完整路径</text><text x="48" y="154" font-size="25" font-weight="400" text-anchor="start" fill="#626262" data-max-width="1104">用同一张 A 和新图 B，跟随两次请求。ID 为示例。</text><rect x="44" y="193" width="316" height="65" rx="11" fill="#f2f2f2" stroke="#bbb" stroke-width="1.5"/><text x="202" y="234" font-size="25" font-weight="650" text-anchor="middle" fill="#171717" data-max-width="292">Codex</text><path d="M202 274L202 1477" fill="none" stroke="#363636" stroke-width="2" stroke-dasharray="7 5"/><rect x="440" y="193" width="316" height="65" rx="11" fill="#f2f2f2" stroke="#bbb" stroke-width="1.5"/><text x="598" y="234" font-size="25" font-weight="650" text-anchor="middle" fill="#171717" data-max-width="292">本机代理 · 映射缓存</text><path d="M598 274L598 1477" fill="none" stroke="#363636" stroke-width="2" stroke-dasharray="7 5"/><rect x="836" y="193" width="316" height="65" rx="11" fill="#f2f2f2" stroke="#bbb" stroke-width="1.5"/><text x="994" y="234" font-size="25" font-weight="650" text-anchor="middle" fill="#171717" data-max-width="292">DeepSeek · 图片文件</text><path d="M994 274L994 1477" fill="none" stroke="#363636" stroke-width="2" stroke-dasharray="7 5"/><rect x="44" y="292" width="1112" height="71" rx="9" fill="#f7f7f7" stroke="none" stroke-width="1.5"/><text x="66" y="338" font-size="27" font-weight="650" text-anchor="start" fill="#171717">01 · 首次请求：A 还没有缓存映射</text><g transform="translate(107 390) scale(0.76)"><rect x="0" y="0" width="100" height="100" rx="10" fill="#fff" stroke="#555" stroke-width="1.5"/><rect x="7" y="7" width="86" height="66" rx="5" fill="#eee" stroke="none" stroke-width="1.5"/><circle cx="72" cy="27" r="8" fill="#8b8b8b"/><path d="M8 68L34 32l20 24 13-17 25 29Z" fill="#737373"/><path d="M8 68L34 49 53 68Z" fill="#bcbcbc"/><text x="50" y="94" font-size="21" font-weight="650" text-anchor="middle" fill="#171717">A</text></g><text x="220" y="406" font-size="23" font-weight="400" text-anchor="start" fill="#171717" data-max-width="370">image_url: Base64(A)</text><path d="M204 434L590 434" fill="none" stroke="#363636" stroke-width="2" marker-end="url(#arrow)"/><rect x="624" y="397" width="315" height="46" rx="9" fill="#f0f0f0" stroke="#cecece" stroke-width="1.5"/><text x="781.5" y="428" font-size="21" font-weight="650" text-anchor="middle" fill="#171717" data-max-width="299" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">POST /files + bytes(A)</text><path d="M607 455L986 455" fill="none" stroke="#363636" stroke-width="2" marker-end="url(#arrow)"/><text x="388" y="481" font-size="21" font-weight="400" text-anchor="middle" fill="#171717" data-max-width="350">解码 → SHA-256 → 未命中</text><g transform="translate(1015 475) scale(0.72)"><rect x="0" y="0" width="100" height="100" rx="10" fill="#fff" stroke="#555" stroke-width="1.5"/><rect x="7" y="7" width="86" height="66" rx="5" fill="#eee" stroke="none" stroke-width="1.5"/><circle cx="72" cy="27" r="8" fill="#8b8b8b"/><path d="M8 68L34 32l20 24 13-17 25 29Z" fill="#737373"/><path d="M8 68L34 49 53 68Z" fill="#bcbcbc"/><text x="50" y="94" font-size="21" font-weight="650" text-anchor="middle" fill="#171717">A</text></g><text x="917" y="588" font-size="21" font-weight="400" text-anchor="middle" fill="#171717" data-max-width="430">DS 保存图片并生成 ID</text><path d="M985 542L607 542" fill="none" stroke="#363636" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="787" y="521" font-size="25" font-weight="650" text-anchor="middle" fill="#171717" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">{ "id": "file_A" }</text><rect x="403" y="601" width="390" height="46" rx="9" fill="#f0f0f0" stroke="#cecece" stroke-width="1.5"/><text x="598" y="632" font-size="23" font-weight="650" text-anchor="middle" fill="#171717" data-max-width="374" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">hash(A) → file_A + expiresAt</text><text x="598" y="680" font-size="22" font-weight="400" text-anchor="middle" fill="#171717" data-max-width="460">持久化映射；不是缓存图片本体</text><path d="M607 741L986 741" fill="none" stroke="#363636" stroke-width="2" marker-end="url(#arrow)"/><text x="797" y="721" font-size="22" font-weight="400" text-anchor="middle" fill="#171717" data-max-width="380" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">/responses · file_id: file_A</text><text x="994" y="787" font-size="22" font-weight="400" text-anchor="middle" fill="#171717" data-max-width="300">读取 A → 模型理解</text><path d="M985 829L210 829" fill="none" stroke="#363636" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="598" y="817" font-size="23" font-weight="400" text-anchor="middle" fill="#171717" data-max-width="760">模型回复经代理流式返回 Codex</text><rect x="44" y="879" width="1112" height="71" rx="9" fill="#f7f7f7" stroke="none" stroke-width="1.5"/><text x="66" y="925" font-size="27" font-weight="650" text-anchor="start" fill="#171717">02 · 下一轮请求：历史 A + 新图 B</text><g transform="translate(83 978) scale(0.64)"><rect x="0" y="0" width="100" height="100" rx="10" fill="#fff" stroke="#555" stroke-width="1.5"/><rect x="7" y="7" width="86" height="66" rx="5" fill="#eee" stroke="none" stroke-width="1.5"/><circle cx="72" cy="27" r="8" fill="#8b8b8b"/><path d="M8 68L34 32l20 24 13-17 25 29Z" fill="#737373"/><path d="M8 68L34 49 53 68Z" fill="#bcbcbc"/><text x="50" y="94" font-size="21" font-weight="650" text-anchor="middle" fill="#171717">A</text></g><g transform="translate(165 978) scale(0.64)"><rect x="0" y="0" width="100" height="100" rx="10" fill="#fff" stroke="#555" stroke-width="1.5"/><rect x="7" y="7" width="86" height="66" rx="5" fill="#eee" stroke="none" stroke-width="1.5"/><path d="M16 69V36h21v33M43 69V17h27v52M76 69V43h14v26" fill="#7b7b7b"/><path d="M49 25h15M49 35h15M49 45h15" stroke="#f3f3f3" stroke-width="4"/><text x="50" y="94" font-size="21" font-weight="650" text-anchor="middle" fill="#171717">B</text></g><text x="244" y="1005" font-size="22" font-weight="400" text-anchor="start" fill="#171717" data-max-width="332">Base64(A) + Base64(B)</text><path d="M204 1058L590 1058" fill="none" stroke="#363636" stroke-width="2" marker-end="url(#arrow)"/><rect x="415" y="1082" width="366" height="46" rx="9" fill="#f0f0f0" stroke="#cecece" stroke-width="1.5"/><text x="598" y="1113" font-size="25" font-weight="650" text-anchor="middle" fill="#171717" data-max-width="350" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">A → file_A · HIT</text><text x="598" y="1162" font-size="22" font-weight="400" text-anchor="middle" fill="#171717" data-max-width="480">A 不再上传；只有 B 进入 Files API</text><path d="M607 1220L986 1220" fill="none" stroke="#363636" stroke-width="2" marker-end="url(#arrow)"/><text x="797" y="1200" font-size="23" font-weight="400" text-anchor="middle" fill="#171717" data-max-width="380" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">POST /files · bytes(B)</text><g transform="translate(1044 1244) scale(0.6)"><rect x="0" y="0" width="100" height="100" rx="10" fill="#fff" stroke="#555" stroke-width="1.5"/><rect x="7" y="7" width="86" height="66" rx="5" fill="#eee" stroke="none" stroke-width="1.5"/><path d="M16 69V36h21v33M43 69V17h27v52M76 69V43h14v26" fill="#7b7b7b"/><path d="M49 25h15M49 35h15M49 45h15" stroke="#f3f3f3" stroke-width="4"/><text x="50" y="94" font-size="21" font-weight="650" text-anchor="middle" fill="#171717">B</text></g><path d="M985 1286L607 1286" fill="none" stroke="#363636" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="787" y="1268" font-size="24" font-weight="400" text-anchor="middle" fill="#171717" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">{ "id": "file_B" }</text><path d="M607 1379L986 1379" fill="none" stroke="#363636" stroke-width="2" marker-end="url(#arrow)"/><text x="797" y="1357" font-size="22" font-weight="400" text-anchor="middle" fill="#171717" data-max-width="380" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">/responses · file_A + file_B</text><text x="994" y="1430" font-size="21" font-weight="400" text-anchor="middle" fill="#171717" data-max-width="316">模型仍理解 A、B 两张图</text><rect x="44" y="1510" width="1112" height="202" rx="16" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/><text x="66" y="1555" font-size="25" font-weight="650" text-anchor="start" fill="#171717" data-max-width="1068">03 · 有效期结束 / 本地记录丢失 → 下次出现时重新上传</text><rect x="66" y="1582" width="245" height="46" rx="9" fill="#f0f0f0" stroke="#cecece" stroke-width="1.5"/><text x="188.5" y="1613" font-size="23" font-weight="650" text-anchor="middle" fill="#171717" data-max-width="229" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">hash(A) → MISS</text><path d="M329 1605L391 1605" fill="none" stroke="#363636" stroke-width="2" marker-end="url(#arrow)"/><rect x="410" y="1582" width="264" height="46" rx="9" fill="#f0f0f0" stroke="#cecece" stroke-width="1.5"/><text x="542" y="1613" font-size="23" font-weight="650" text-anchor="middle" fill="#171717" data-max-width="248" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">POST /files · A</text><path d="M693 1605L755 1605" fill="none" stroke="#363636" stroke-width="2" marker-end="url(#arrow)"/><rect x="774" y="1582" width="352" height="46" rx="9" fill="#f0f0f0" stroke="#cecece" stroke-width="1.5"/><text x="950" y="1613" font-size="23" font-weight="650" text-anchor="middle" fill="#171717" data-max-width="336" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">DS → file_A2</text><text x="66" y="1682" font-size="21" font-weight="400" text-anchor="start" fill="#626262" data-max-width="1068">默认请求 30 天 TTL；重启保留映射；远端提前删除目前不会自动重传。</text><text x="48" y="1764" font-size="21" font-weight="400" text-anchor="start" fill="#626262" data-max-width="1104">实线：请求 / 上传    虚线：返回 / 生命线    图片 A、B 的字节身份跨轮保持一致</text></svg>
