name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check runtime capabilities
        run: node -e "const z=require('node:zlib'); for (const [k,v] of Object.entries({zstdCompress:z.zstdCompress,zstdDecompress:z.zstdDecompress,File,FormData,fetch})) if (typeof v!=='function') throw new Error(k)"
      - name: Run tests
        run: node --test tests/*.test.js
      - name: Check syntax and executable scripts
        run: npm run check
      - name: Build release archive
        run: sh scripts/package-release.sh
      - name: Inspect release archive
        run: |
          tar -tzf dist/pixelpass-v*-macos.tar.gz
          unzip -l dist/pixelpass-v*-windows.zip
          (cd dist && shasum -a 256 -c ./*.sha256)
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run proxy tests
        run: node --test
      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem src/*.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object {
                Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)"
              }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Test Windows install and control lifecycle
        shell: pwsh
        run: ./scripts/windows-install-smoke.ps1
